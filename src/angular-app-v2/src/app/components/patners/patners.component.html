<div class="container">
  <app-section-header
    title="Partners"
    subtitle="Source and target partners referenced by transformation templates."
  >
    <button
      pButton
      type="button"
      [label]="showCreateForm ? 'Cancel' : 'Add Partner'"
      [icon]="showCreateForm ? 'pi pi-times' : 'pi pi-plus'"
      severity="primary"
      (click)="showCreateForm = !showCreateForm; error = null"
    ></button>
  </app-section-header>

  @if (showCreateForm) {
    <div class="form-container">
      <h3>Create Partner</h3>
      <form (ngSubmit)="createPartner()" #partnerForm="ngForm">
        <div class="form-row">
          <div class="form-group col-6">
            <label for="partnerName"> Partner Name <span class="required">*</span> </label>
            <input
              id="partnerName"
              type="text"
              [(ngModel)]="newPartner.name"
              name="name"
              required
              placeholder="Enter partner name"
              [disabled]="creating"
            />
          </div>
          <div class="form-group col-6">
            <label for="description">Description</label>
            <textarea
              id="description"
              [(ngModel)]="newPartner.description"
              name="description"
              rows="3"
              [disabled]="creating"
            ></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-success" [disabled]="!partnerForm.form.valid || creating">
            @if (creating) {
              <span class="spinner"></span>
            }
            {{ creating ? 'Creating...' : 'Create Partner' }}
          </button>
          <button type="button" class="btn btn-secondary" (click)="cancelCreate()" [disabled]="creating">Cancel</button>
        </div>
      </form>
    </div>
  }

  @if (error) {
    <div class="error">{{ error }}</div>
  }

  <app-data-table
    [rows]="partners"
    [columns]="partnerColumns"
    [loading]="loading"
    dataKey="id"
    emptyIcon="pi-users"
    emptyHeading="No partners yet"
    emptyMessage='Click "Add Partner" to add the first one.'
  >
    <ng-template #row let-partner>
      <tr>
        <td>{{ partner.name }}</td>
        <td>{{ partner.description }}</td>
        <td>{{ partner.createdAt | date: 'short' }}</td>
        <td style="text-align: center">
          <app-row-actions [items]="menuFor(partner)" />
        </td>
      </tr>
    </ng-template>
  </app-data-table>
</div>
