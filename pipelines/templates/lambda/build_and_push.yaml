---
parameters:
- name: IMAGE_NAME
  type: string
- name: PROJECT_FILE
  type: string
  default: false
- name: TEST_FILES
  type: string
  default: false

steps:
  - script: |
      sudo apt update && sudo apt-get install -y awscli
    displayName: Install AWS CLI
  
  - script: |
      if ! dotnet tool list -g | grep -q 'amazon.lambda.tools'; then
        dotnet tool install -g Amazon.Lambda.Tools
      else
        echo "Amazon.Lambda.Tools is already installed."
      fi
    displayName: "Install AWS Lambda Tools"

  - script: |
      aws ecr get-login-password --region $(AWS_REGION) | docker login --username AWS --password-stdin $(ECR_REPOSITORY_URI)
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
    displayName: Login to ECR

  - task: DotNetCoreCLI@2
    displayName: "Version of build tools"
    inputs:
      command: custom
      custom: "--info"
    continueOnError: true
    timeoutInMinutes: 1

  - task: NuGetAuthenticate@1
    displayName: "NuGet Authenticate"

  - task: DotNetCoreCLI@2
    displayName: Restore
    inputs:
      command: restore
      projects: ${{ parameters.PROJECT_FILE }}
      feedsToUse: config
      nugetConfigPath: $(System.DefaultWorkingDirectory)/src/backend/nuget.config
    timeoutInMinutes: 4

  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      projects: ${{ parameters.PROJECT_FILE }}
      arguments: "--configuration Release"

  - task: DotNetCoreCLI@2
    displayName: 'Package Lambda Container'
    inputs:
      command: custom
      custom: lambda
      workingDirectory: ${{ parameters.PROJECT_FILE }}
      arguments: 'package --configuration Release --os linux --arch x64 --image-tag $(ECR_REPOSITORY_URI)/${{ parameters.IMAGE_NAME }}:$(Build.BuildId)'

  - script: |
      # Also tag the image with 'latest'
      docker tag $(ECR_REPOSITORY_URI)/${{ parameters.IMAGE_NAME }}:$(Build.BuildId) $(ECR_REPOSITORY_URI)/${{ parameters.IMAGE_NAME }}:latest
    
      docker push $(ECR_REPOSITORY_URI)/${{ parameters.IMAGE_NAME }}:$(Build.BuildId)
      docker push $(ECR_REPOSITORY_URI)/${{ parameters.IMAGE_NAME }}:latest
    displayName: 'Push Docker Images to ECR'
