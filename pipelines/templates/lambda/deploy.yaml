parameters:
  - name: IMAGE_NAME
    type: string
  - name: LAMBDA_FUNCTION_NAME
    type: string
  - name: ECR_REPOSITORY_URI
    type: string
    default: '$(AWS_ACCOUNT_ID).dkr.ecr.us-east-1.amazonaws.com'

steps:
  # Update the Lambda function code to use the newly pushed image
  - script: |
      aws lambda update-function-code --function-name ${{ parameters.LAMBDA_FUNCTION_NAME }} --image-uri ${{ parameters.ECR_REPOSITORY_URI }}/${{ parameters.IMAGE_NAME }}:latest
    displayName: "Update Lambda function to latest image."
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
    timeoutInMinutes: 5